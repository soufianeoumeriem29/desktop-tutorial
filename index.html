<!DOCTYPE html>
<html lang="it" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>365Bus Italia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>365Bus Italia</h1>
            <select id="languageSelector">
                <option value="it">Italiano</option>
                <option value="en">English</option>
                <option value="ar">العربية</option>
            </select>
        </header>

        <main>
            <h2>Muoviti in Italia semplicemente</h2>
            <p>Trova e confronta i biglietti dell'autobus al miglior prezzo</p>

            <div class="search-box">
                <!-- حقل المغادرة مع قائمة خيارات تلقائية -->
                <input type="text" id="fromInput" placeholder="Partenza (es. Roma, Milano...)" list="citiesList">
                
                <!-- حقل الوصول مع نفس قائمة الخيارات -->
                <input type="text" id="toInput" placeholder="Arrivo (es. Firenze, Bologna...)" list="citiesList">

                <!-- قائمة المدن الإيطالية التي تظهر فوراً عند الكتابة -->
                <datalist id="citiesList">
                    <option value="Roma">
                    <option value="Milano">
                    <option value="Napoli">
                    <option value="Torino">
                    <option value="Firenze">
                    <option value="Bologna">
                    <option value="Venezia">
                    <option value="Verona">
                    <option value="Palermo">
                    <option value="Genova">
                    <option value="Bari">
                    <option value="Catania">
                    <option value="Bologna Centrale">
                    <option value="Roma Termini">
                    <option value="Milano Centrale">
                </datalist>

                <input type="date" id="dateInput">
                
                <div class="buttons-group">
                    <button type="button">Autobus</button>
                    <button type="button">Treno</button>
                </div>

                <button id="searchBtn">Cerca il viaggio migliore</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
