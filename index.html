<!DOCTYPE html>
<html lang="it" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>365Bus Italia - Tutto in un'unica app</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 1.5rem;
            color: #38bdf8;
        }

        #languageSelector {
            background: #1e293b;
            color: #fff;
            border: 1px solid #334155;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        main {
            text-align: center;
        }

        main h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        main p {
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .search-box {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: left;
        }

        .input-group {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 14px 16px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: #38bdf8;
        }

        .buttons-group {
            display: flex;
            gap: 10px;
        }

        .transport-btn {
            flex: 1;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .transport-btn.active {
            background-color: #3b82f6;
            border-color: #60a5fa;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        #searchBtn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        #searchBtn:hover {
            opacity: 0.9;
        }

        /* قسم روابط النقل الحضري والمحلي الإضافي */
        .local-transport-section {
            margin-top: 25px;
            background-color: #1e293b;
            padding: 20px;
            border-radius: 16px;
            text-align: left;
        }

        .local-transport-section h3 {
            font-size: 1.1rem;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        .local-links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .local-link-item {
            background-color: #0f172a;
            border: 1px solid #334155;
            padding: 10px 12px;
            border-radius: 8px;
            color: #e2e8f0;
            text-decoration: none;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s;
        }

        .local-link-item:hover {
            border-color: #38bdf8;
            color: #38bdf8;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>365Bus Italia</h1>
            <select id="languageSelector">
                <option value="it">Italiano</option>
                <option value="en">English</option>
                <option value="ar">العربية</option>
            </select>
        </header>

        <main>
            <h2 id="mainTitle">Tutti i trasporti in Italia in un'app</h2>
            <p id="mainSub">Autobus, treni nazionali e collegamenti urbani locali</p>

            <div class="search-box">
                <div class="input-group">
                    <input type="text" id="fromInput" placeholder="Partenza (es. Faenza, Bologna, Roma...)" list="italianCities">
                </div>

                <div class="input-group">
                    <input type="text" id="toInput" placeholder="Arrivo (es. Ravenna, Firenze, Milano...)" list="italianCities">
                </div>

                <datalist id="italianCities">
                    <option value="Roma">
                    <option value="Milano">
                    <option value="Napoli">
                    <option value="Torino">
                    <option value="Firenze">
                    <option value="Bologna">
                    <option value="Faenza">
                    <option value="Ravenna">
                    <option value="Forlì">
                    <option value="Rimini">
                    <option value="Venezia">
                    <option value="Verona">
                    <option value="Bologna Centrale">
                    <option value="Roma Termini">
                </datalist>

                <input type="date" id="dateInput">
                
                <div class="buttons-group">
                    <button type="button" class="transport-btn active" data-type="flixbus">FlixBus</button>
                    <button type="button" class="transport-btn" data-type="trenitalia">Treno (Trenitalia)</button>
                </div>

                <button id="searchBtn">Cerca il viaggio</button>
            </div>

            <!-- قسم النقل الحضري والمحلي للقرى والمدن -->
            <div class="local-transport-section">
                <h3 id="localTitle">🚍 Trasporto Urbano e Locale (TPL)</h3>
                <div class="local-links">
                    <a href="https://www.startromagna.it/" target="_blank" class="local-link-item">Start Romagna <span>↗</span></a>
                    <a href="https://www.tper.it/" target="_blank" class="local-link-item">TPER (Bologna/Ferrara) <span>↗</span></a>
                    <a href="https://www.trenitalia.com/" target="_blank" class="local-link-item">Regionali Trenitalia <span>↗</span></a>
                    <a href="https://www.autoguidovie.it/" target="_blank" class="local-link-item">Autoguidovie <span>↗</span></a>
                </div>
            </div>
        </main>
    </div>

    <script>
        const translations = {
            it: {
                title: "Tutti i trasporti in Italia in un'app",
                subtitle: "Autobus, treni nazionali e collegamenti urbani locali",
                searchBtn: "Cerca il viaggio",
                localTitle: "🚍 Trasporto Urbano e Locale (TPL)"
            },
            en: {
                title: "All transport in Italy in one app",
                subtitle: "Buses, national trains, and local urban connections",
                searchBtn: "Search Trip",
                localTitle: "🚍 Urban & Local Transport"
            },
            ar: {
                title: "جميع وسائل النقل في إيطاليا في تطبيق واحد",
                subtitle: "حافلات، قطارات وطنية، وخطوط النقل الحضري المحلي للقرى والمدن",
                searchBtn: "بحث عن الرحلة",
                localTitle: "🚍 النقل الحضري والمحلي (للبلديات والقرى)"
            }
        };

        const langSelector = document.getElementById('languageSelector');
        const fromInput = document.getElementById('fromInput');
        const toInput = document.getElementById('toInput');
        const dateInput = document.getElementById('dateInput');
        const searchBtn = document.getElementById('searchBtn');
        const mainTitle = document.getElementById('mainTitle');
        const mainSub = document.getElementById('mainSub');
        const localTitle = document.getElementById('localTitle');
        const transportBtns = document.querySelectorAll('.transport-btn');

        let selectedProvider = 'flixbus';
        let currentLang = 'it';

        transportBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                transportBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedProvider = btn.getAttribute('data-type');
            });
        });

        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];

            if (lang === 'ar') {
                document.documentElement.setAttribute('dir', 'rtl');
                document.documentElement.setAttribute('lang', 'ar');
            } else {
                document.documentElement.setAttribute('dir', 'ltr');
                document.documentElement.setAttribute('lang', lang);
            }

            if (mainTitle) mainTitle.textContent = t.title;
            if (mainSub) mainSub.textContent = t.subtitle;
            if (searchBtn) searchBtn.textContent = t.searchBtn;
            if (localTitle) localTitle.textContent = t.localTitle;
        }

        if (langSelector) {
            langSelector.addEventListener('change', (e) => {
                changeLanguage(e.target.value);
            });
        }

        if (searchBtn) {
            searchBtn.addEventListener('click', (e) => {
                e.preventDefault();

                const origin = fromInput ? fromInput.value.trim() : '';
                const destination = toInput ? toInput.value.trim() : '';

                if (!origin || !destination) {
                    alert(currentLang === 'ar' ? 'يرجى إدخال محطة المغادرة والوصول' : (currentLang === 'it' ? 'Inserisci la stazione di partenza e arrivo' : 'Please enter departure and arrival'));
                    return;
                }

                let targetUrl = '';
                if (selectedProvider === 'flixbus') {
                    // رابط موثوق لـ FlixBus
                    targetUrl = `https://www.flixbus.it/`;
                } else {
                    // رابط موثوق لـ Trenitalia
                    targetUrl = `https://www.trenitalia.com/`;
                }

                window.open(targetUrl, '_blank');
            });
        }
    </script>
</body>
</html>
